<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow10" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#581c87" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coolantGrad10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glassChamber10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56,189,248,0.2)"/>
      <stop offset="50%" stop-color="rgba(192,132,252,0.1)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.25)"/>
    </linearGradient>
    <filter id="hydroGlow10" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#bgGlow10)"/>

  <!-- Base Shadow -->
  <ellipse cx="200" cy="250" rx="130" ry="22" fill="#000000" opacity="0.8" filter="blur(8px)"/>

  <!-- Lower Base & Pump Manifold -->
  <path d="M 100 215 L 300 215 L 280 245 L 120 245 Z" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="130" y="218" width="140" height="12" rx="4" fill="#09090b" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <text x="145" y="227" fill="#38bdf8" font-family="monospace" font-size="8">HYDRO PUMP: 3600 RPM</text>

  <!-- DUAL LIQUID COOLING RESERVOIRS (Transparent Glass Cylinders) -->
  <!-- Left Reservoir -->
  <g transform="translate(145, 145)">
    <!-- Base Caps -->
    <ellipse cx="0" cy="55" rx="30" ry="8" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <ellipse cx="0" cy="-55" rx="30" ry="8" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <!-- Glass Cylinder -->
    <rect x="-30" y="-55" width="60" height="110" fill="url(#glassChamber10)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Coolant Liquid Inside -->
    <rect x="-26" y="-35" width="52" height="85" rx="6" fill="url(#coolantGrad10)" opacity="0.85" filter="url(#hydroGlow10)"/>
    <!-- Bubbles / Flow Particles -->
    <circle cx="-10" cy="20" r="3" fill="#ffffff" opacity="0.8"/>
    <circle cx="12" cy="0" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="-5" cy="-20" r="2.5" fill="#ffffff" opacity="0.8"/>
    <!-- Glass Highlight Streak -->
    <line x1="-22" y1="-50" x2="-22" y2="45" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Right Reservoir -->
  <g transform="translate(255, 145)">
    <!-- Base Caps -->
    <ellipse cx="0" cy="55" rx="30" ry="8" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <ellipse cx="0" cy="-55" rx="30" ry="8" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <!-- Glass Cylinder -->
    <rect x="-30" y="-55" width="60" height="110" fill="url(#glassChamber10)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <!-- Coolant Liquid Inside -->
    <rect x="-26" y="-35" width="52" height="85" rx="6" fill="url(#coolantGrad10)" opacity="0.85" filter="url(#hydroGlow10)"/>
    <!-- Bubbles / Flow Particles -->
    <circle cx="8" cy="25" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="-12" cy="5" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="5" cy="-15" r="2" fill="#ffffff" opacity="0.8"/>
    <!-- Glass Highlight Streak -->
    <line x1="-22" y1="-50" x2="-22" y2="45" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Central Interconnect Heat Exchanger Hub -->
  <g transform="translate(200, 145)">
    <rect x="-25" y="-45" width="50" height="90" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <!-- Digital Gauges -->
    <circle cx="0" cy="-20" r="14" fill="#09090b" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="-20" x2="6" y2="-26" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="18" r="14" fill="#09090b" stroke="#c084fc" stroke-width="1.5"/>
    <line x1="0" y1="18" x2="5" y2="12" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Coolant Manifold Pipes (Connecting Left to Right) -->
  <path d="M 145 90 L 200 80 L 255 90" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#hydroGlow10)"/>
  <path d="M 145 200 L 200 205 L 255 200" fill="none" stroke="#c084fc" stroke-width="6" stroke-linecap="round" filter="url(#hydroGlow10)"/>

  <!-- Floating Badge -->
  <g transform="translate(200, 42)" filter="url(#hydroGlow10)">
    <rect x="-70" y="-13" width="140" height="26" rx="13" fill="rgba(88,28,135,0.75)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="4" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">💧 10 TON HYDRO</text>
  </g>
</svg>
