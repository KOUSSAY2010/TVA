  <!-- Floating Badge -->
  <g transform="translate(200, 42)" filter="url(#neonGlow5)">
    <rect x="-65" y="-13" width="130" height="26" rx="13" fill="rgba(88,28,135,0.75)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="0" y="4" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">🖥️ 5 TON RACK</text>
