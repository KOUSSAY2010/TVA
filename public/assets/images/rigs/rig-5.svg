    <text x="64" y="28" fill="#34d399" font-family="monospace" font-size="7">RUNNING</text>

    <!-- Blade 2 -->
    <rect x="10" y="44" width="95" height="26" rx="4" fill="url(#serverBlade5)" stroke="#3f3f46" stroke-width="1"/>
    <rect x="15" y="49" width="16" height="16" rx="3" fill="#09090b"/>
    <circle cx="23" cy="57" r="5" fill="#a855f7" filter="url(#neonGlow5)"/>
    <circle cx="36" cy="57" r="2" fill="#10b981"/>
    <circle cx="43" cy="57" r="2" fill="#38bdf8"/>
