    <circle cx="23" cy="25" r="5" fill="#a855f7" filter="url(#neonGlow5)"/>
    <circle cx="36" cy="25" r="2" fill="#10b981"/>
    <circle cx="43" cy="25" r="2" fill="#38bdf8"/>
    <circle cx="50" cy="25" r="2" fill="#c084fc"/>
