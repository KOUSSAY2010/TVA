<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow25" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#3b0764" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stealthGrad25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="plasmaBeam25" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="datacenterGlow25" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#bgGlow25)"/>

  <!-- Base Shadow -->
  <ellipse cx="200" cy="255" rx="140" ry="20" fill="#000000" opacity="0.85" filter="blur(8px)"/>

  <!-- DATACENTER MONOLITH (Heavy Stealth Facets) -->
  <g transform="translate(200, 155)">
    <!-- Base Platform -->
    <polygon points="-110,80 110,80 130,95 -130,95" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Left Angular Wing -->
    <polygon points="-100,75 -70,-65 -40,-65 -50,75" fill="url(#stealthGrad25)" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- Right Angular Wing -->
    <polygon points="100,75 70,-65 40,-65 50,75" fill="url(#stealthGrad25)" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Central Supercomputing Tower -->
    <polygon points="-45,-75 45,-75 45,75 -45,75" fill="#09090b" stroke="rgba(167,139,250,0.5)" stroke-width="2"/>

    <!-- Center Plasma Channel (Glowing vertical core) -->
    <rect x="-8" y="-65" width="16" height="135" rx="4" fill="url(#plasmaBeam25)" filter="url(#datacenterGlow25)"/>
    <line x1="0" y1="-65" x2="0" y2="70" stroke="#ffffff" stroke-width="3" filter="url(#datacenterGlow25)"/>

    <!-- Horizontal Bus Bars Crossing Central Core -->
    <line x1="-35" y1="-40" x2="35" y2="-40" stroke="#a855f7" stroke-width="3" filter="url(#datacenterGlow25)"/>
    <line x1="-35" y1="-10" x2="35" y2="-10" stroke="#a855f7" stroke-width="3" filter="url(#datacenterGlow25)"/>
    <line x1="-35" y1="20" x2="35" y2="20" stroke="#a855f7" stroke-width="3" filter="url(#datacenterGlow25)"/>
    <line x1="-35" y1="50" x2="35" y2="50" stroke="#a855f7" stroke-width="3" filter="url(#datacenterGlow25)"/>

    <!-- Left Wing Data Ports & LEDs -->
    <g fill="#38bdf8" filter="url(#datacenterGlow25)">
      <circle cx="-60" cy="-35" r="2.5"/>
      <circle cx="-60" cy="-15" r="2.5"/>
      <circle cx="-60" cy="5" r="2.5"/>
      <circle cx="-60" cy="25" r="2.5"/>
      <circle cx="-60" cy="45" r="2.5"/>
    </g>

    <!-- Right Wing Data Ports & LEDs -->
    <g fill="#10b981" filter="url(#datacenterGlow25)">
      <circle cx="60" cy="-35" r="2.5"/>
      <circle cx="60" cy="-15" r="2.5"/>
      <circle cx="60" cy="5" r="2.5"/>
      <circle cx="60" cy="25" r="2.5"/>
      <circle cx="60" cy="45" r="2.5"/>
    </g>

    <!-- Top Crown Heat Exchangers -->
    <polygon points="-40,-75 0,-92 40,-75" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <circle cx="0" cy="-84" r="5" fill="#c084fc" filter="url(#datacenterGlow25)"/>
  </g>

  <!-- Network Circuit Lines in Background -->
  <g stroke="rgba(192,132,252,0.25)" stroke-width="1.5" fill="none">
    <path d="M 60 120 L 110 120 L 140 150"/>
    <path d="M 340 120 L 290 120 L 260 150"/>
    <path d="M 50 180 L 100 180 L 130 200"/>
    <path d="M 350 180 L 300 180 L 270 200"/>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(200, 42)" filter="url(#datacenterGlow25)">
    <rect x="-75" y="-13" width="150" height="26" rx="13" fill="rgba(88,28,135,0.8)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="0" y="4" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">🌐 25 TON NODE</text>
  </g>
</svg>
