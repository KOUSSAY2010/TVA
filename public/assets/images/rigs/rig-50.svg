<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow50" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plasmaBall50" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0abfc"/>
      <stop offset="65%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </radialGradient>
    <filter id="fusionGlow50" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="url(#bgGlow50)"/>

  <!-- Base Shadow -->
  <ellipse cx="200" cy="255" rx="135" ry="22" fill="#000000" opacity="0.85" filter="blur(8px)"/>

  <!-- Lower Tokamak Platform -->
  <path d="M 110 225 L 290 225 L 270 252 L 130 252 Z" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <ellipse cx="200" cy="225" rx="85" ry="16" fill="#27272a" stroke="rgba(167,139,250,0.4)" stroke-width="2"/>

  <!-- FUSION REACTOR CORE -->
  <g transform="translate(200, 150)">
    <!-- Outer Magnetic Containment Ring (Dark Armor) -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#18181b" stroke-width="20"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#3f3f46" stroke-width="2"/>

    <!-- 6 Magnetic Confinement Coils -->
    <rect x="-14" y="-87" width="28" height="24" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
    <rect x="-14" y="63" width="28" height="24" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
    <g transform="rotate(60)">
      <rect x="-14" y="-87" width="28" height="24" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
      <rect x="-14" y="63" width="28" height="24" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
    </g>
    <g transform="rotate(120)">
      <rect x="-14" y="-87" width="28" height="24" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
      <rect x="-14" y="63" width="28" height="24" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
    </g>

    <!-- Swirling Plasma Torus Ring (Inner Glowing Loop) -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="#c084fc" stroke-width="5" stroke-dasharray="14,6" filter="url(#fusionGlow50)"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="8,8" filter="url(#fusionGlow50)"/>

    <!-- Plasma Particle Jets Radiating Inward -->
    <line x1="0" y1="-65" x2="0" y2="-25" stroke="#ffffff" stroke-width="3" filter="url(#fusionGlow50)"/>
    <line x1="0" y1="65" x2="0" y2="25" stroke="#ffffff" stroke-width="3" filter="url(#fusionGlow50)"/>
    <line x1="-65" y1="0" x2="-25" y2="0" stroke="#ffffff" stroke-width="3" filter="url(#fusionGlow50)"/>
    <line x1="65" y1="0" x2="25" y2="0" stroke="#ffffff" stroke-width="3" filter="url(#fusionGlow50)"/>

    <!-- Central Micro Fusion Star -->
    <circle cx="0" cy="0" r="30" fill="url(#plasmaBall50)" filter="url(#fusionGlow50)"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#fusionGlow50)"/>

    <!-- Diagonal Lightning Arcs -->
    <path d="M -15 -15 L -6 0 L 10 -8 L 22 12" stroke="#ffffff" stroke-width="2" fill="none" filter="url(#fusionGlow50)"/>
  </g>

  <!-- Heavy High-Voltage Conduits Left & Right -->
  <path d="M 60 170 Q 100 130 115 150" stroke="#a855f7" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#fusionGlow50)"/>
  <path d="M 340 170 Q 300 130 285 150" stroke="#a855f7" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#fusionGlow50)"/>

  <!-- Floating Badge -->
  <g transform="translate(200, 42)" filter="url(#fusionGlow50)">
    <rect x="-75" y="-13" width="150" height="26" rx="13" fill="rgba(88,28,135,0.85)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="0" y="4" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="0.5">⚡ 50 TON FUSION</text>
  </g>
</svg>
